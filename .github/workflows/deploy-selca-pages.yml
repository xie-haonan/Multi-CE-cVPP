# 将 ``showcase/selca`` 发布到 GitHub Pages 子路径 ``/selca/``（便于挂在 xie-haonan.github.io 域名下的项目路径）。
# 启用：Settings → Pages → Source → GitHub Actions
# 展示页：https://<owner>.github.io/<repo>/selca/
# 仓库根 URL 自动跳转到 selca/（见 ``showcase/github_pages_site_root_index.html``）。
name: Deploy SELCA showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site (root redirect + /selca/ app)
        run: |
          set -euo pipefail
          mkdir -p _site/selca
          cp -R showcase/selca/. _site/selca/
          cp showcase/github_pages_site_root_index.html _site/index.html

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
