# 将 ``showcase/selca`` 与 ``showcase/megm`` 发布到 GitHub Pages 子路径 ``/selca/``、``/megm/``。
# 启用：Settings → Pages → Source → GitHub Actions
# 访问：https://<owner>.github.io/<repo>/selca/ 与 …/megm/
# 根路径为静态门户（无 Jekyll 头，便于 Actions 原样托管）。
name: Deploy showcase pages to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site (portal + /selca/ + /megm/)
        run: |
          set -euo pipefail
          mkdir -p _site/selca _site/megm
          cp -R showcase/selca/. _site/selca/
          cp -R showcase/megm/. _site/megm/
          cp showcase/github_pages_site_root_index.html _site/index.html

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
